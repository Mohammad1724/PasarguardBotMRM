name: Python quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml

      - name: Sync locked runtime and test dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run --no-sync ruff check

      - name: Ruff format
        run: uv run --no-sync ruff format --check

      - name: Compile Python sources
        run: python -m compileall -q app main.py config.py

      - name: Regression tests
        run: uv run --no-sync pytest -q

  mariadb-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-retries=10
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: local-ci-only
          MARIADB_DATABASE: pasarguard_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml
      - run: uv sync --frozen
      - name: Real database and concurrency regressions
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379
          TEST_DATABASE_URL: mysql+asyncmy://root:local-ci-only@127.0.0.1:3306/pasarguard_test
        run: uv run --no-sync pytest -q

      - name: Install MariaDB backup client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client

      - name: Customer experience migration and real backup roundtrip
        env:
          CX_MIGRATION_TEST_URL: mysql+asyncmy://root:local-ci-only@127.0.0.1:3306/cx_migration_test
          TEST_REDIS_URL: redis://127.0.0.1:6379
        run: |
          uv run --no-sync python - <<'PY'
          import asyncio
          import asyncmy
          async def prepare():
              conn = await asyncmy.connect(host="127.0.0.1", port=3306, user="root", password="local-ci-only")
              async with conn.cursor() as cursor:
                  await cursor.execute("CREATE DATABASE cx_migration_test CHARACTER SET utf8mb4")
              conn.close()
          asyncio.run(prepare())
          PY
          uv run --no-sync python tests/integration/customer_experience_roundtrip.py
